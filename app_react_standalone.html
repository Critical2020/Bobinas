    // --- UTILITIES ---
    function formatUSD(amt) { return `$${Number(amt || 0).toFixed(2)}`; }

    function generateAutoCoilId(existingCoils = [], brand = '') {
      const brandPrefix = brand ? String(brand).replace(/[^a-zA-Z]/g, '').slice(0, 4).toUpperCase() : '';
      const prefix = brandPrefix ? `BOB-${brandPrefix}` : 'BOB';
      let maxNum = 0;
      if (Array.isArray(existingCoils)) {
        existingCoils.forEach(item => {
          if (!item || !item.id) return;
          const match = String(item.id).match(/(\d+)$/);
          if (match) {
            const n = parseInt(match[1], 10);
            if (!isNaN(n) && n > maxNum && n < 100000) maxNum = n;
          }
        });
      }
      const nextNum = maxNum > 0 ? maxNum + 1 : (existingCoils.length ? existingCoils.length + 1 : 1);
      const padded = String(nextNum).padStart(3, '0');
      const candidateId = `${prefix}-${padded}`;
      const exists = Array.isArray(existingCoils) && existingCoils.some(c => String(c.id).toLowerCase() === candidateId.toLowerCase());
      if (exists) {
        const randomSuffix = Math.floor(100 + Math.random() * 900);
        return `${prefix}-${randomSuffix}`;
      }
      return candidateId;
    }

    function normalizeCoilRecord(raw, existingCoils = []) {
      if (!raw || typeof raw !== 'object') return null;
      if (raw.error || raw.message) return null;

      // Price / Precio
      const rawPrice = raw.price ?? raw.precio ?? raw.costo ?? raw.valor ?? raw.precio_usd ?? 25;
      const priceVal = parseFloat(rawPrice);
      const safePrice = !isNaN(priceVal) && priceVal >= 0 ? priceVal : 25.00;

      // Old Price / Precio Anterior
      const rawOldPrice = raw.oldPrice ?? raw.old_price ?? raw.precio_anterior ?? raw.precio_lista ?? raw.precio_viejo;
      const oldPriceVal = parseFloat(rawOldPrice);
      const safeOldPrice = !isNaN(oldPriceVal) && oldPriceVal > 0 ? oldPriceVal : Number((safePrice * 1.2).toFixed(2));

      // Stock / Cantidad
      const rawStock = raw.stock ?? raw.cantidad ?? raw.existencia ?? raw.inventario ?? raw.unidades ?? raw.qty ?? 0;
      const stockVal = parseInt(rawStock, 10);
      const safeStock = !isNaN(stockVal) && stockVal >= 0 ? stockVal : 0;

      // Brand / Marca
      const brandVal = String(raw.brand ?? raw.marca ?? raw.fabricante ?? 'Chevrolet').trim();

      // ID / Código
      const idVal = String(raw.id ?? raw.ID ?? raw.codigo ?? raw.code ?? raw.id_bobina ?? raw.cod ?? raw._id ?? '').trim();
      const safeId = idVal || generateAutoCoilId(existingCoils, brandVal);

      // Name / Nombre
      const nameVal = String(raw.name ?? raw.nombre ?? raw.title ?? raw.titulo ?? raw.repuesto ?? raw.producto ?? raw.descripcion ?? '').trim();

      // Model / Modelo
      const modelVal = String(raw.carModel ?? raw.car_model ?? raw.modelo ?? raw.aplicacion ?? raw.vehiculo ?? raw.auto ?? 'Multimodelo').trim();

      // Engine / Motor
      const engineVal = String(raw.engine ?? raw.motor ?? raw.cilindrada ?? '1.6L / 2.0L').trim();

      // OEM / Parte
      const oemVal = String(raw.oem ?? raw.codigo_oem ?? raw.oem_code ?? raw.part_number ?? raw.numero_parte ?? 'OEM-STD').trim();

      // Type / Tipo
      const typeVal = String(raw.type ?? raw.tipo ?? 'Tipo Lápiz Individual').trim();

      // Connector / Pines
      const connectorVal = String(raw.connector ?? raw.conector ?? raw.pines ?? 'Conector 4 Pines').trim();

      // Warranty / Garantía
      const warrantyVal = String(raw.warranty ?? raw.garantia ?? '12 meses').trim();

      // Badge / Etiqueta
      const badgeVal = String(raw.badge ?? raw.etiqueta ?? raw.tag ?? 'OEM Spec').trim();

      // Image / Foto
      const rawImage = String(raw.image ?? raw.imageUrl ?? raw.image_url ?? raw.img ?? raw.foto ?? raw.imagen ?? raw.url_imagen ?? '').trim();

      return {
        id: safeId,
        name: nameVal || 'Bobina de Encendido Automotriz',
        brand: brandVal,
        carModel: modelVal,
        engine: engineVal,
        oem: oemVal,
        type: typeVal,
        connector: connectorVal,
        price: safePrice,
        oldPrice: safeOldPrice,
        stock: safeStock,
        inStock: safeStock > 0,
        warranty: warrantyVal,
        badge: badgeVal,
        image: rawImage
      };
    }

    function getEngineLabel(engine) {
      const map = { supabase: 'Supabase (PostgreSQL)', mongodb: 'MongoDB Atlas', mysql: 'MySQL / MariaDB', local: 'LocalStorage DB' };
      return map[engine] || 'Supabase (PostgreSQL)';
    }

    function normalizeWaPhone(rawPhone) {
      let digits = String(rawPhone || OFFICIAL_WA_RAW).replace(/[^0-9]/g, '');
      if (!digits) digits = '584126497478';
      if (digits.startsWith('0') && digits.length === 11) digits = '58' + digits.substring(1);
      else if (digits.length === 10 && (digits.startsWith('412') || digits.startsWith('414') || digits.startsWith('424') || digits.startsWith('416') || digits.startsWith('426'))) digits = '58' + digits;
      return digits;
    }

    function parseCSV(csvText) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let insideQuotes = false;
      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];
        if (char === '"') {
          if (insideQuotes && nextChar === '"') { currentField += '"'; i++; }
          else insideQuotes = !insideQuotes;
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentField.trim());
          currentField = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentField.trim());
          currentField = '';
          if (currentRow.some(col => col.length > 0)) rows.push(currentRow);
          currentRow = [];
        } else {
          currentField += char;
        }
      }
      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        if (currentRow.some(col => col.length > 0)) rows.push(currentRow);
      }
      if (rows.length < 2) throw new Error('El archivo CSV debe contener al menos cabecera y 1 fila de datos.');
      const headers = rows[0].map(h => h.trim().replace(/^"|"$/g, ''));
      const records = [];
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = row[idx] !== undefined ? row[idx] : ''; });
        records.push(obj);
      }
      return records;
    }

    function exportToCSV(items) {
      const headers = ['id', 'name', 'brand', 'carModel', 'engine', 'oem', 'type', 'connector', 'price', 'oldPrice', 'stock', 'warranty', 'badge'];
      const escapeField = val => {
        const str = String(val ?? '');
        if (str.includes(',') || str.includes('"') || str.includes('\n')) return `"${str.replace(/"/g, '""')}"`;
        return str;
      };
      const headerRow = headers.join(',');
      const dataRows = items.map(item => headers.map(h => escapeField(item[h])).join(','));
      return [headerRow, ...dataRows].join('\n');
    }

    function exportToSQL(items) {
      const safe = str => String(str ?? '').replace(/'/g, "''");
      const inserts = items.map(b => 
        `INSERT INTO bobinas_inventario (id, name, brand, car_model, engine, oem, type, connector, price, old_price, stock, warranty, badge) VALUES ('${safe(b.id)}', '${safe(b.name)}', '${safe(b.brand)}', '${safe(b.carModel)}', '${safe(b.engine)}', '${safe(b.oem)}', '${safe(b.type)}', '${safe(b.connector)}', ${Number(b.price).toFixed(2)}, ${Number(b.oldPrice || b.price * 1.2).toFixed(2)}, ${b.stock}, '${safe(b.warranty)}', '${safe(b.badge)}');`
      ).join('\n');
      return `-- DUMP SQL BOBINAS EXPRESS\n${inserts}`;
    }

    function downloadFile(content, fileName, mimeType = 'text/plain;charset=utf-8;') {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    const ToastContext = createContext(null);
    function ToastProvider({ children }) {
      const [toast, setToast] = useState({ message: '', visible: false });

        setToast({ message, visible: true });
        setTimeout(() => setToast(prev => ({ ...prev, visible: false })), 3200);
      }, []);
      return (
        <ToastContext.Provider value={{ showToast }}>
          {children}
          <div className={`fixed bottom-6 right-6 z-50 transform transition-all duration-300 pointer-events-none ${toast.visible ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0'}`}>

            </div>
          </div>
        </ToastContext.Provider>
      );
    }
    const useToast = () => useContext(ToastContext);

    const AuthContext = createContext(null);
    function AuthProvider({ children }) {
      const { showToast } = useToast();
      const [isAdmin, setIsAdmin] = useState(() => localStorage.getItem('AUTOIGNITION_ADMIN_SESSION_V2') === 'true');
      const [deviceId] = useState(() => {
        let s = localStorage.getItem('AUTOIGNITION_PRIVATE_CLIENT_ID_V2');
        if (!s) { s = 'CLI-' + Math.random().toString(36).substring(2, 8).toUpperCase(); localStorage.setItem('AUTOIGNITION_PRIVATE_CLIENT_ID_V2', s); }
        return s;
      });
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authLockReason, setAuthLockReason] = useState('');
      const [pendingAction, setPendingAction] = useState(null);

      const login = (user, pass) => {
        const u = String(user || '').trim().toLowerCase();
        const p = String(pass || '').trim();
        if ((u === 'admin' || u === 'dueno') && (p === '123456' || p === 'admin123')) {
          setIsAdmin(true);
          localStorage.setItem('AUTOIGNITION_ADMIN_SESSION_V2', 'true');
          showToast('🔓 Sesión de Administrador iniciada: Módulos críticos desbloqueados');
          setAuthModalOpen(false);
          if (typeof pendingAction === 'function') { const act = pendingAction; setPendingAction(null); act(); }
          return true;
        } else {
          showToast('❌ Contraseña incorrecta');
          return false;
        }
      };

      const logout = () => {
        setIsAdmin(false);
        localStorage.removeItem('AUTOIGNITION_ADMIN_SESSION_V2');
        showToast('🔒 Sesión de Administrador cerrada');
      };

      const requireAdminAuth = (callback, reason = 'Acción requiere sesión de Administrador.') => {
        if (isAdmin) { callback(); return true; }
        setPendingAction(() => callback);
        setAuthLockReason(reason);
        setAuthModalOpen(true);
        return false;
      };

      return (
        <AuthContext.Provider value={{ isAdmin, deviceId, login, logout, requireAdminAuth, authModalOpen, authLockReason, openAuthModal: (r) => { setAuthLockReason(r || ''); setAuthModalOpen(true); }, closeAuthModal: () => setAuthModalOpen(false) }}>
          {children}
        </AuthContext.Provider>
      );
    }
    const useAuth = () => useContext(AuthContext);

    const InventoryContext = createContext(null);
    function InventoryProvider({ children }) {
      const { showToast } = useToast();
      const [coils, setCoils] = useState(() => {
        try {
          const s = localStorage.getItem('BOBINAS_EXPRESS_STORE_V4');

    function CartProvider({ children }) {
      const { deviceId } = useAuth();
      const { coils, processSaleTransaction, ownerSettings } = useInventory();
      const { showToast } = useToast();
      const [cart, setCart] = useState(() => {
        try {
          const s = localStorage.getItem('AUTOIGNITION_PRIVATE_CARTS_V2');
          if (s) { const p = JSON.parse(s); if (p[deviceId]) return p[deviceId]; }
        } catch(e) {}
        return [];
      });
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [buyerDraft, setBuyerDraft] = useState(() => {
        try { const s = localStorage.getItem('AUTOIGNITION_BUYER_DRAFT_V2'); if (s) return JSON.parse(s); } catch(e) {}
        return { name: '', phone: '', car: '', payRef: '' };
      });

      const persistCart = (newCart) => {
        try {
          const s = localStorage.getItem('AUTOIGNITION_PRIVATE_CARTS_V2');
          const all = s ? JSON.parse(s) : {};
          all[deviceId] = newCart;
          localStorage.setItem('AUTOIGNITION_PRIVATE_CARTS_V2', JSON.stringify(all));
        } catch(e) {}
      };

      const updateBuyerDraft = (fields) => {
        setBuyerDraft(prev => {
          const next = { ...prev, ...fields };
          localStorage.setItem('AUTOIGNITION_BUYER_DRAFT_V2', JSON.stringify(next));
          return next;
        });
      };

      const addToCart = (productId, requestedQty = 1) => {
        const product = coils.find(b => b.id === productId);
        if (!product || product.stock <= 0) { showToast('Sin stock disponible'); return; }
        setCart(prev => {
          const existing = prev.find(i => i.id === productId);
          let next;
          if (existing) {
            if (existing.qty + requestedQty <= product.stock) {
              next = prev.map(i => i.id === productId ? { ...i, qty: i.qty + requestedQty } : i);
              showToast(`Carrito: ${existing.qty + requestedQty}x ${product.name}`);
            } else {
              showToast(`Límite de stock alcanzado (${product.stock} uds)`);
              return prev;
            }
          } else {
            next = [...prev, { id: product.id, name: product.name, price: product.price, oem: product.oem.split('/')[0].trim(), qty: 1, maxStock: product.stock }];
            showToast(`Añadido: ${product.name}`);
          }
          persistCart(next);
          return next;
        });
      };

      const updateCartQty = (productId, delta) => {
        setCart(prev => {
          const product = coils.find(b => b.id === productId);
          const max = product ? product.stock : 99;
          const next = prev.map(item => {
            if (item.id === productId) {
              const n = item.qty + delta;
              return { ...item, qty: Math.min(max, n) };
            }
            return item;
          }).filter(item => item.qty > 0);
          persistCart(next);
          return next;
        });
      };

      const removeFromCart = (id) => {
        setCart(prev => {
          const next = prev.filter(i => i.id !== id);
          persistCart(next);
          return next;
        });
        showToast('Producto eliminado');
      };

      const checkoutViaWhatsApp = () => {
        if (cart.length === 0) { showToast('El carrito está vacío'); return; }
        if (!buyerDraft.name.trim() || !buyerDraft.phone.trim()) { showToast('Ingresa Nombre y WhatsApp para ordenar'); return; }

        const orderIds = [];
        cart.forEach(item => {
          const res = processSaleTransaction({
            coilId: item.id,
            qty: item.qty,
            customerName: buyerDraft.name.trim(),
            customerPhone: buyerDraft.phone.trim(),
            paymentRef: buyerDraft.payRef.trim() || 'Coordinar por WA',
            userId: deviceId
          });
          if (res) orderIds.push(res.orderId);
        });

        const itemsText = cart.map(i => `• ${i.qty}x ${i.name} ($${Number(i.price).toFixed(2)})`).join('\n');
        const totalVal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
        const orderTag = orderIds.join(', ') || 'ORD-WA';

        const msg = `⚡ *NUEVO PEDIDO CONFIRMADO (${orderTag}) - BOBINAS EXPRESS*\n\n` +
          `👤 *Cliente:* ${buyerDraft.name} (${buyerDraft.phone})\n` +
          `🚗 *Vehículo:* ${buyerDraft.car || 'Por especificar'}\n` +
          `💳 *Pago:* ${buyerDraft.payRef || 'A coordinar'}\n\n` +
          `📦 *Repuestos:*\n${itemsText}\n\n` +
          `💰 *Total:* $${totalVal.toFixed(2)} USD\n\n` +
          `✅ *Stock reservado en sistema.*`;

        const phone = normalizeWaPhone(ownerSettings.ownerPhone);
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        setCart([]);
        persistCart([]);
        setIsCartOpen(false);
      };

      const cartCount = cart.reduce((acc, curr) => acc + curr.qty, 0);
      const cartSubtotal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

      return (
        <CartContext.Provider value={{ cart, cartCount, cartSubtotal, isCartOpen, setIsCartOpen, toggleCart: () => setIsCartOpen(p => !p), closeCart: () => setIsCartOpen(false), addToCart, updateCartQty, removeFromCart, buyerDraft, updateBuyerDraft, checkoutViaWhatsApp }}>
          {children}
        </CartContext.Provider>
      );
    }
    const useCart = () => useContext(CartContext);

    function SimulatorView({ initialPrompt, onTriggerSale }) {
      const { coils, dbEngine, ownerSettings, processSaleTransaction } = useInventory();
      const { deviceId, isAdmin } = useAuth();
      const [input, setInput] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const [showAdminConsole, setShowAdminConsole] = useState(true);
      const [logs, setLogs] = useState([]);
      const [messages, setMessages] = useState(() => [
        { 
          id: '1', 
          sender: 'bot', 
          html: `¡Hola! 👋 Soy el <strong>Asesor Virtual Inteligente de Bobinas Express</strong>.<br><br>Escríbeme la marca, modelo de auto, año o código OEM que necesitas y confirmaré existencias y precios al instante.`, 
          badge: `Conectado a ${getEngineLabel(dbEngine)} (${coils.length} bobinas)`, 
          time: 'Ahora' 
        }
      ]);
      const endRef = useRef(null);

      useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, isTyping]);
      useEffect(() => { if (initialPrompt) handleSend(initialPrompt); }, [initialPrompt]);

      const handleSend = (textToSend) => {
        const text = String(textToSend || input).trim();
        if (!text) return;
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setMessages(prev => [...prev, { id: Math.random().toString(), sender: 'user', text, time }]);
        setInput('');
        setIsTyping(true);

        setTimeout(() => {
          setIsTyping(false);
          const clean = text.toLowerCase();
          const tokens = clean.replace(/[¿?¡!.,;:#()]/g, ' ').split(/\s+/).filter(w => w.length >= 2 && !['hola', 'tienen', 'precio', 'bobina', 'para', 'de', 'el', 'la'].includes(w));

          let bestMatch = null;
          let maxScore = 0;
          coils.forEach(item => {
            const h = `${item.id} ${item.name} ${item.brand} ${item.carModel} ${item.engine} ${item.oem}`.toLowerCase();
            let score = 0;
            tokens.forEach(tk => { if (h.includes(tk)) score += 3; });
            if (score > maxScore) { maxScore = score; bestMatch = item; }
          });

          const isBuy = clean.includes('comprar') || clean.includes('pago') || clean.includes('ref') || clean.includes('confirmo');
          let botHtml = '';
          let product = null;
          let badge = '';

          if (isBuy && bestMatch && bestMatch.stock > 0) {
            const ord = processSaleTransaction({ coilId: bestMatch.id, qty: 1, customerName: 'Cliente Chat WA', customerPhone: 'WhatsApp', paymentRef: text, userId: deviceId });
            badge = `[TX COMMIT ${getEngineLabel(dbEngine)}] Orden #${ord.orderId}`;
            botHtml = `🎉 <strong>¡VENTA CONFIRMADA! (#${ord.orderId})</strong><br><br>Descontamos 1x <strong>${bestMatch.name}</strong> del inventario:<br>• <strong>Total:</strong> <span class="text-emerald-400 font-bold">${formatUSD(bestMatch.price)} USD</span><br>${isAdmin ? `• <strong>Nuevo Stock DB:</strong> ${ord.stockBefore} ➔ <strong>${ord.stockAfter} uds</strong><br><br>` : `• <strong>Estado del Pedido:</strong> <span class="text-emerald-400 font-bold">Aprobado y en preparación para despacho</span><br><br>`}📲 <em>Alerta enviada al dueño al ${ownerSettings.ownerPhone}.</em>`;
            setLogs(prev => [{ id: Math.random().toString(), time, query: `TX COMMIT: #${ord.orderId} [${bestMatch.id}]`, count: 1, engine: getEngineLabel(dbEngine), latency: 25 }, ...prev]);
          } else if (bestMatch && maxScore > 0) {
            product = bestMatch;
            badge = `[${getEngineLabel(dbEngine)}] ID: ${bestMatch.id} | Stock: ${bestMatch.stock}`;
            if (bestMatch.stock > 0) {
              botHtml = `✅ ¡Sí, disponible en stock inmediato!<br><br>• <strong>${bestMatch.name}</strong><br>• <strong>Aplicación:</strong> ${bestMatch.carModel}<br>• <strong>Precio:</strong> <span class="text-brand-400 font-bold">${formatUSD(bestMatch.price)} USD</span><br>• <strong>Stock:</strong> <span class="text-emerald-400 font-bold">${bestMatch.stock} unidades</span><br>• <strong>OEM:</strong> <code>${bestMatch.oem}</code><br><br>Escribe <code>"Quiero comprar ref 12345"</code> o usa el botón abajo para cerrar tu compra.`;
            } else {
              botHtml = `⚠️ La <strong>${bestMatch.name}</strong> se encuentra temporalmente con <strong>Stock: 0 unidades</strong>.<br>Precio: ${formatUSD(bestMatch.price)} USD. ¿Deseas encargarla bajo pedido?`;
            }
            setLogs(prev => [{ id: Math.random().toString(), time, query: `SELECT * WHERE id='${bestMatch.id}'`, count: 1, engine: getEngineLabel(dbEngine), latency: 32 }, ...prev]);
          } else {
            badge = `[${getEngineLabel(dbEngine)}] 0 registros`;
            botHtml = isAdmin
              ? `Consulté la base de datos para <em>"${text}"</em> y no encontré un registro exacto.<br><br>💡 <em>Tip de Administrador: Puedes agregarla desde el panel de <strong>"Base de Datos & Stock"</strong>.</em>`
              : `No encontramos una coincidencia exacta en catálogo para <em>"${text}"</em>.<br><br>💡 Por favor verifica el año, modelo o código OEM, o escríbenos directamente por WhatsApp.`;
            setLogs(prev => [{ id: Math.random().toString(), time, query: `SELECT * WHERE name LIKE '%${tokens.join(' ')}%'`, count: 0, engine: getEngineLabel(dbEngine), latency: 18 }, ...prev]);
          }

          setMessages(prev => [...prev, { id: Math.random().toString(), sender: 'bot', html: botHtml, badge, product, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
        }, 500);
      };

      const handleResetChat = () => {
        setMessages([
          { 
            id: Math.random().toString(), 
            sender: 'bot', 
            html: `¡Hola! 👋 Historial reiniciado. Estoy listo para ayudarte. ¿Qué modelo o código OEM deseas consultar?`, 
            badge: `Conectado a ${getEngineLabel(dbEngine)} (${coils.length} bobinas)`, 
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
          }
        ]);
      };

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-300 mb-1">Tabla SQL</label>
                      <input type="text" value={tabValues.table || ''} onChange={e => handleFieldChange('table', e.target.value)} placeholder="bobinas" className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white font-mono" />

                    <button type="button" onClick={() => changeDbEngine(activeTab)} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-semibold cursor-pointer border border-slate-700">
                      <i className="fa-solid fa-check text-emerald-400 mr-1"></i> Activar este Motor
                    </button>
                  )}
                  <button type="button" onClick={handlePingTest} className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-sky-300 rounded-xl text-xs font-semibold cursor-pointer border border-sky-500/30">
                    <i className="fa-solid fa-tower-broadcast mr-1"></i> Probar Conexión (Ping)
                  </button>
                  <button type="button" onClick={handlePullClick} disabled={isSyncing} className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-emerald-300 rounded-xl text-xs font-semibold cursor-pointer border border-emerald-500/30">
                    <i className={`fa-solid fa-cloud-arrow-down ${isSyncing ? 'fa-bounce text-emerald-400' : ''} mr-1`}></i> {isSyncing ? 'Cargando...' : 'Importar de DB (PULL)'}
                  </button>
                  <button type="button" onClick={handlePushClick} disabled={isSyncing} className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded-xl text-xs font-semibold cursor-pointer border border-amber-500/30">
                    <i className={`fa-solid fa-cloud-arrow-up ${isSyncing ? 'fa-bounce text-amber-400' : ''} mr-1`}></i> Exportar a DB (PUSH)
                  </button>
                </div>

                <button type="submit" className="px-4 py-1.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-xs font-bold cursor-pointer shadow">
                  <i className="fa-solid fa-floppy-disk mr-1"></i> Guardar Credenciales
                </button>
              </div>
            </form>
          </div>

          {/* Table */}
          <div className="bg-slate-900 border border-slate-700/80 rounded-2xl overflow-hidden shadow-xl">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs text-slate-300">
                <thead className="bg-slate-950 text-slate-400 uppercase text-[10px] font-mono">
                  <tr>
                    <th className="py-3 px-4">ID</th>
                    <th className="py-3 px-4">Marca & Repuesto</th>
                    <th className="py-3 px-4">Vehículos</th>
                    <th className="py-3 px-4">OEM</th>
                    <th className="py-3 px-4">Precio</th>
                    <th className="py-3 px-4 text-center">Stock</th>
                    <th className="py-3 px-4 text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {coils.length === 0 ? (
                    <tr>
                      <td colSpan="7" className="py-8 text-center text-slate-500">
                        La base de datos está vacía (0 artículos). Inserta nuevas bobinas o pulsa "Restaurar Semilla".
                      </td>
                    </tr>
                  ) : (
                    coils.map(b => (
                      <tr key={b.id} className="hover:bg-slate-800/50">
                        <td className="py-3 px-4 font-mono font-bold text-sky-400">{b.id}</td>
                        <td className="py-3 px-4">
                          <div className="flex items-center gap-2.5">
                            <div className="w-8 h-8 rounded-lg bg-slate-800 border border-slate-700 overflow-hidden flex-shrink-0 flex items-center justify-center">
                              {b.image ? (
                                <img src={b.image} alt={b.name} className="w-full h-full object-cover" onError={e => { e.currentTarget.style.display = 'none'; }} />
                              ) : (
                                <i className="fa-solid fa-car-battery text-brand-400 text-xs"></i>
                              )}
                            </div>
                            <div>
                              <span className="text-[10px] uppercase font-bold text-brand-400 block">{b.brand}</span>
                              <span className="text-white font-medium truncate block max-w-xs">{b.name}</span>
                            </div>
                          </div>
                        </td>
                        <td className="py-3 px-4 text-slate-300">{b.carModel}</td>
                        <td className="py-3 px-4 font-mono text-slate-400">{b.oem}</td>
                        <td className="py-3 px-4 text-brand-400 font-bold">{formatUSD(b.price)}</td>
                        <td className="py-3 px-4 text-center"><span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${b.stock > 0 ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}`}>{b.stock} uds</span></td>
                        <td className="py-3 px-4 text-right space-x-2">
                          <button onClick={() => onOpenEdit(b)} className="text-sky-400 hover:text-sky-300 p-1 cursor-pointer"><i className="fa-solid fa-pen-to-square"></i></button>
                          <button onClick={() => deleteCoil(b.id)} className="text-rose-400 hover:text-rose-300 p-1 cursor-pointer"><i className="fa-solid fa-trash-can"></i></button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

            <div>
              <label className="block text-xs font-semibold text-slate-300 mb-1">Prompt de Instrucciones de la IA</label>

        </div>

    function CartDrawer() {
      const { isCartOpen, closeCart, cart, cartSubtotal, updateCartQty, removeFromCart, buyerDraft, updateBuyerDraft, checkoutViaWhatsApp } = useCart();
      if (!isCartOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex justify-end bg-black/70 backdrop-blur-xs">
          <div className="w-full max-w-md bg-slate-900 border-l border-slate-700 p-5 flex flex-col justify-between">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 className="font-bold text-white text-sm"><i className="fa-solid fa-cart-shopping text-brand-400 mr-2"></i> Mi Carrito</h3>
              <button onClick={closeCart} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark"></i></button>
            </div>
            <div className="flex-1 overflow-y-auto py-4 space-y-3">
              {cart.length === 0 ? <p className="text-slate-500 text-center py-10 text-xs">Tu carrito está vacío</p> : cart.map(item => (
                <div key={item.id} className="p-3 bg-slate-800 rounded-xl flex items-center justify-between text-xs">
                  <div>
                    <div className="font-bold text-white">{item.name}</div>
                    <div className="text-brand-400 font-bold">{formatUSD(item.price)}</div>
                  </div>
                  <div className="flex items-center gap-2">
                    <button onClick={() => updateCartQty(item.id, -1)} className="w-6 h-6 bg-slate-700 text-white rounded">-</button>
                    <span className="font-bold text-white">{item.qty}</span>
                    <button onClick={() => updateCartQty(item.id, 1)} className="w-6 h-6 bg-slate-700 text-white rounded">+</button>
                    <button onClick={() => removeFromCart(item.id)} className="text-rose-400 p-1"><i className="fa-solid fa-trash"></i></button>
                  </div>
                </div>
              ))}
            </div>
            {cart.length > 0 && (
              <div className="space-y-3 pt-3 border-t border-slate-800 text-xs">
                <input type="text" value={buyerDraft.name} onChange={e => updateBuyerDraft({ name: e.target.value })} placeholder="Tu Nombre *" className="w-full p-2 bg-slate-800 border border-slate-700 rounded-lg text-white" />
                <input type="text" value={buyerDraft.phone} onChange={e => updateBuyerDraft({ phone: e.target.value })} placeholder="Tu WhatsApp *" className="w-full p-2 bg-slate-800 border border-slate-700 rounded-lg text-white font-mono" />
                <div className="flex justify-between font-bold text-white text-sm">
                  <span>Total:</span>
                  <span className="text-emerald-400 font-mono">{formatUSD(cartSubtotal)}</span>
                </div>
                <button onClick={checkoutViaWhatsApp} className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl flex items-center justify-center gap-2 cursor-pointer shadow">
                  <i className="fa-brands fa-whatsapp text-lg"></i> Enviar Pedido a WhatsApp
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

      if (!authModalOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full space-y-4">

            {authLockReason && <p className="text-xs text-rose-300 bg-rose-500/10 p-2.5 rounded-lg border border-rose-500/20">{authLockReason}</p>}
            <input type="text" value={u} onChange={e => setU(e.target.value)} placeholder="Usuario (admin)" className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white" />

    function ProductModalStandalone({ isOpen, onClose, initialProduct }) {
      const { coils, upsertCoil, deleteCoil } = useInventory();
      const isEditing = Boolean(initialProduct && initialProduct.id);
      const fileInputRef = useRef(null);

      const [form, setForm] = useState({
        id: '',
        name: '',
        brand: 'Chevrolet',
        carModel: '',
        engine: '',
        oem: '',
        type: 'Tipo Lápiz Individual',
        connector: 'Conector 4 Pines',
        price: '29.50',
        oldPrice: '36.00',
        stock: '15',
        warranty: '12 meses',
        badge: 'OEM Spec',
        image: ''
      });
      const [idAutoGenerated, setIdAutoGenerated] = useState(true);

      useEffect(() => {
        if (initialProduct && initialProduct.id) {
          setForm({
            id: initialProduct.id,
            name: initialProduct.name || '',
            brand: initialProduct.brand || 'Chevrolet',
            carModel: initialProduct.carModel || '',
            engine: initialProduct.engine || '',
            oem: initialProduct.oem || '',
            type: initialProduct.type || 'Tipo Lápiz Individual',
            connector: initialProduct.connector || 'Conector 4 Pines',
            price: String(initialProduct.price || '29.50'),
            oldPrice: String(initialProduct.oldPrice || '36.00'),
            stock: String(initialProduct.stock || '15'),
            warranty: initialProduct.warranty || '12 meses',
            badge: initialProduct.badge || 'OEM Spec',
            image: initialProduct.image || ''
          });
          setIdAutoGenerated(false);
        } else if (isOpen) {
          const brand = 'Chevrolet';
          const autoId = generateAutoCoilId(coils, brand);
          setForm({
            id: autoId,
            name: '',
            brand,
            carModel: '',
            engine: '',
            oem: '',
            type: 'Tipo Lápiz Individual',
            connector: 'Conector 4 Pines',
            price: '29.50',
            oldPrice: '36.00',
            stock: '15',
            warranty: '12 meses',
            badge: 'OEM Spec',
            image: ''
          });
          setIdAutoGenerated(true);
        }
      }, [initialProduct, isOpen, coils]);

      if (!isOpen) return null;

      const handleRegenId = () => {
        const fresh = generateAutoCoilId(coils, form.brand);
        setForm(p => ({ ...p, id: fresh }));
        setIdAutoGenerated(true);
      };

      const handleBrandChange = (b) => {
        setForm(p => {
          const next = { ...p, brand: b };
          if (!isEditing && idAutoGenerated) next.id = generateAutoCoilId(coils, b);
          return next;
        });
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setForm(prev => ({ ...prev, image: ev.target.result }));
        };
        reader.readAsDataURL(file);
      };

      const handleSave = (e) => {
        e.preventDefault();
        upsertCoil(form);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
          <div className="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[92vh] overflow-y-auto">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-white">
              <i className="fa-solid fa-xmark text-lg"></i>
            </button>
            <h3 className="text-base font-bold text-white mb-4 flex items-center gap-2">
              <i className={`fa-solid ${isEditing ? 'fa-pen-to-square text-sky-400' : 'fa-database text-brand-500'}`}></i>
              <span>{isEditing ? `Editar Bobina (${form.id})` : 'Insertar Nueva Bobina en Base de Datos'}</span>
            </h3>

            <form onSubmit={handleSave} className="space-y-4">
              {/* Image Upload Box */}
              <div className="p-3.5 bg-slate-800/80 border border-slate-700 rounded-xl space-y-2.5">
                <div className="flex items-center justify-between text-[11px] font-semibold text-slate-300">
                  <span className="flex items-center gap-1.5"><i className="fa-solid fa-camera text-brand-400"></i> Foto del Producto</span>
                  {form.image && (
                    <button type="button" onClick={() => setForm(p => ({ ...p, image: '' }))} className="text-rose-400 hover:text-rose-300 text-[10px] font-bold">
                      <i className="fa-solid fa-trash-can mr-1"></i> Quitar foto
                    </button>
                  )}
                </div>
                <div className="flex items-center gap-3">
                  <div className="w-16 h-16 rounded-xl bg-slate-950 border border-slate-700 flex items-center justify-center overflow-hidden shrink-0">
                    {form.image ? (
                      <img src={form.image} alt="Preview" className="w-full h-full object-cover" onError={e => { e.currentTarget.style.display = 'none'; }} />
                    ) : (
                      <i className="fa-solid fa-image text-slate-600 text-xl"></i>
                    )}
                  </div>
                  <div className="flex-1 space-y-2">
                    <div className="flex items-center gap-2">
                      <input type="file" ref={fileInputRef} accept="image/*" onChange={handleFileUpload} className="hidden" id="sa-photo-upload" />
                      <label htmlFor="sa-photo-upload" className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-semibold cursor-pointer border border-slate-600">
                        <i className="fa-solid fa-arrow-up-from-bracket text-sky-400 mr-1"></i> Subir archivo...
                      </label>
                      <span className="text-[10px] text-slate-400">JPG, PNG o WEBP</span>
                    </div>
                    <input type="url" value={form.image} onChange={e => setForm(p => ({ ...p, image: e.target.value }))} placeholder="O pegar URL de imagen (https://...)" className="w-full px-2.5 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-[11px] text-slate-200" />
                  </div>
                </div>
              </div>

              {/* ID & Brand */}
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="text-[11px] font-semibold text-slate-400">Código / ID (Único) *</label>
                    {!isEditing && (
                      <button type="button" onClick={handleRegenId} className="text-[10px] text-brand-400 hover:text-brand-300 font-bold">
                        <i className="fa-solid fa-rotate mr-0.5"></i> Auto-generar
                      </button>
                    )}
                  </div>
                  <input type="text" value={form.id} onChange={e => { setForm(p => ({ ...p, id: e.target.value })); setIdAutoGenerated(false); }} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" required />
                </div>
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Marca de Auto *</label>
                  <input type="text" value={form.brand} onChange={e => handleBrandChange(e.target.value)} placeholder="Chevrolet, Toyota..." className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white" required />
                </div>
              </div>

              <div>
                <label className="block text-[11px] font-semibold text-slate-400 mb-1">Nombre Completo *</label>
                <input type="text" value={form.name} onChange={e => setForm(p => ({ ...p, name: e.target.value }))} placeholder="Bobina de Encendido Chevrolet Captiva 3.2" className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white" required />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Modelos Compatibles *</label>
                  <input type="text" value={form.carModel} onChange={e => setForm(p => ({ ...p, carModel: e.target.value }))} placeholder="Captiva Sport 3.2L" className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white" required />
                </div>
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Motor / Cilindrada *</label>
                  <input type="text" value={form.engine} onChange={e => setForm(p => ({ ...p, engine: e.target.value }))} placeholder="3.2L V6" className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" required />
                </div>
              </div>

              <div>
                <label className="block text-[11px] font-semibold text-slate-400 mb-1">Código OEM *</label>
                <input type="text" value={form.oem} onChange={e => setForm(p => ({ ...p, oem: e.target.value }))} placeholder="12618542 / UF569" className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" required />
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Precio USD ($) *</label>
                  <input type="number" step="0.01" value={form.price} onChange={e => setForm(p => ({ ...p, price: e.target.value }))} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" required />
                </div>
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Precio Tachado</label>
                  <input type="number" step="0.01" value={form.oldPrice} onChange={e => setForm(p => ({ ...p, oldPrice: e.target.value }))} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" />
                </div>
                <div>
                  <label className="block text-[11px] font-semibold text-slate-400 mb-1">Stock *</label>
                  <input type="number" value={form.stock} onChange={e => setForm(p => ({ ...p, stock: e.target.value }))} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-xl text-xs text-white font-mono" required />
                </div>
              </div>

              <div className="pt-3 flex items-center justify-between gap-2 border-t border-slate-800">
                {isEditing ? (
                  <button type="button" onClick={() => { deleteCoil(form.id); onClose(); }} className="px-3 py-1.5 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 border border-rose-500/30 rounded-xl text-xs font-semibold cursor-pointer flex items-center gap-1">
                    <i className="fa-solid fa-trash-can"></i> Eliminar
                  </button>
                ) : <div></div>}
                <div className="flex gap-2">
                  <button type="button" onClick={onClose} className="px-3.5 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-xs">Cancelar</button>
                  <button type="submit" className="px-4 py-1.5 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-xl text-xs shadow">Guardar</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function App() {
      const [tab, setTab] = useState('catalog');
      const [initialPrompt, setInitialPrompt] = useState('');
      const [editCoil, setEditCoil] = useState(null);
      const [createModal, setCreateModal] = useState(false);
      const [bulkModal, setBulkModal] = useState(false);
      const [bulkText, setBulkText] = useState('');
      const { upsertCoil, deleteCoil, bulkImport } = useInventory();

      return (
        <div className="flex flex-col min-h-screen">
          <TopNoticeBar />
          <Header activeTab={tab} setActiveTab={setTab} />
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            {tab === 'catalog' && (
              <CatalogView
                onNavigateTab={setTab}
                onAskAI={coil => { setInitialPrompt(`¿Tienen la bobina de ${coil.name}?`); setTab('simulator'); }}
                onEdit={c => setEditCoil(c)}
              />
            )}
            {tab === 'simulator' && (
              <SimulatorView initialPrompt={initialPrompt} onTriggerSale={c => { setTab('sales'); }} />
            )}
            {tab === 'sales' && <SalesView onOpenManualSale={() => setTab('catalog')} />}
            {tab === 'database' && (
              <DatabaseView
                onOpenCreate={() => setCreateModal(true)}
                onOpenEdit={c => setEditCoil(c)}
                onOpenBulk={() => setBulkModal(true)}
                onOpenSchema={() => {}}
              />
            )}
            {tab === 'admin' && <AdminConfigView />}
          </main>

          <footer className="bg-slate-950 border-t border-slate-800 py-6 text-center text-xs text-slate-500">
            Bobinas Express &copy; {new Date().getFullYear()} •{' '}
            <a
              href="https://wa.me/584126497478"
              target="_blank"
              rel="noopener noreferrer"
              className="text-emerald-400 hover:text-emerald-300 font-semibold underline"
            >
              WhatsApp
            </a>{' '}
            • Desarrollado con React 18 Modular
          </footer>

          <CartDrawer />
          <AuthModal />

          {/* Modal Edición / Creación Completa con Foto y Auto-ID */}
          <ProductModalStandalone
            isOpen={createModal || Boolean(editCoil)}
            onClose={() => { setCreateModal(false); setEditCoil(null); }}
            initialProduct={editCoil}
          />

          {/* Modal Carga Masiva */}
          {bulkModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-lg w-full space-y-3">
                <h3 className="text-sm font-bold text-white">Carga Masiva (CSV / JSON)</h3>
                <textarea rows={8} value={bulkText} onChange={e => setBulkText(e.target.value)} placeholder="Pega aquí tu CSV o JSON..." className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded text-xs text-white font-mono" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setBulkModal(false)} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs">Cancelar</button>
                  <button onClick={() => {
                    try {
                      let recs = [];
                      if (bulkText.trim().startsWith('[') || bulkText.trim().startsWith('{')) recs = JSON.parse(bulkText);
                      else recs = parseCSV(bulkText);
                      bulkImport(recs, false);
                      setBulkModal(false);
                    } catch(e) { alert('Error: ' + e.message); }
                  }} className="px-4 py-1.5 bg-sky-600 text-white font-bold rounded text-xs">Importar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ToastProvider>
        <AuthProvider>
          <InventoryProvider>
            <CartProvider>
              <App />
            </CartProvider>
          </InventoryProvider>
        </AuthProvider>
      </ToastProvider>
    );
  </script>
</body>
</html>
