      { id: 'BOB-CLIO16V', name: 'Bobina Tipo Lápiz Renault Clio / Mégane / Logan / Kangoo 16V', brand: 'Renault', carModel: 'Clio II, Symbol, Logan, Sandero, Duster, Mégane II', engine: '1.4L K4J / 1.6L K4M / 2.0L F4R 16V', oem: '7700875000 / 8200154186A', type: 'Tipo Lápiz Individual Beru Spec', connector: 'Conector 2 Pines', price: 18.50, oldPrice: 23.00, stock: 40, inStock: true, warranty: '12 meses', badge: 'Oferta' },
      { id: 'BOB-ELANTRA', name: 'Bobina Hyundai Tucson / Elantra / Kia Sportage 2.0', brand: 'Hyundai', carModel: 'Tucson, Elantra, Sportage, Cerato (2005 - 2012)', engine: '2.0L Beta II / 1.8L', oem: '27301-23700 / 27301-23900', type: 'Bobina Pack Doble con Soporte', connector: 'Conector 3 Pines', price: 31.00, oldPrice: 38.00, stock: 8, inStock: true, warranty: '12 meses', badge: 'Pocas Unidades' },
      { id: 'BOB-CRUZE18', name: 'Riel de Bobinas Chevrolet Cruze 1.8 / Sonic 1.6 Ecotec', brand: 'Chevrolet', carModel: 'Cruze, Sonic, Tracker, Orlando (2010 - 2018)', engine: '1.6L / 1.8L Ecotec 16V', oem: '55570160 / 25195107 / 96476983', type: 'Riel Completo 4 Cilindros', connector: 'Conector 7 Pines Lateral', price: 58.00, oldPrice: 75.00, stock: 6, inStock: true, warranty: '12 meses', badge: 'Premium' },

      { id: 'BOB-DFSK16', name: 'Bobina de Encendido Dong Feng / DFSK 1.6', brand: 'DFSK', carModel: 'CS35, CS55, Alsvin, Glory 560', engine: '1.6L Bluetec / DOHC', oem: '444-2112 / DF-16029', type: 'Tipo Lápiz Individual', connector: 'Conector 3 Pines', price: 30.00, oldPrice: 38.00, stock: 2, inStock: true, warranty: '2 meses', badge: 'OEM DFSK' }
    ];

    const INITIAL_SALES_SEED = [
      { orderId: 'ORD-8901', timestamp: 'Hoy, 09:15 AM', userId: 'CLI-INITIAL', customerName: 'Taller Electromecánica Zulia', customerPhone: '0414-6112233', coilId: 'BOB-CORSA1416', coilName: 'Bobina de Encendido Chevrolet Corsa 1.4 / 1.6 / Chevy', oem: '10450424', qty: 1, unitPrice: 34.00, totalPrice: 34.00, stockBefore: 23, stockAfter: 22, paymentRef: 'Pago Móvil Ref #550129', status: 'CONFIRMED' }
    ];

    const OFFICIAL_WA_RAW = '04126497478';

    // --- UTILITIES ---
    function formatUSD(amt) { return `$${Number(amt || 0).toFixed(2)}`; }

    function normalizeCoilRecord(raw) {
      const priceVal = parseFloat(raw.price);
      const safePrice = !isNaN(priceVal) && priceVal >= 0 ? priceVal : 25.00;
      const rawOldPrice = parseFloat(raw.oldPrice || raw.old_price);
      const safeOldPrice = !isNaN(rawOldPrice) && rawOldPrice > 0 ? rawOldPrice : Number((safePrice * 1.2).toFixed(2));
      const stockVal = parseInt(raw.stock, 10);
      const safeStock = !isNaN(stockVal) && stockVal >= 0 ? stockVal : 0;
      const idVal = String(raw.id || '').trim();
      return {
        id: idVal || `BOB-${Math.floor(100 + Math.random() * 900)}`,
        name: String(raw.name || 'Bobina de Encendido Automotriz').trim(),
        brand: String(raw.brand || 'Chevrolet').trim(),
        carModel: String(raw.carModel || raw.car_model || 'Multimodelo').trim(),
        engine: String(raw.engine || '1.6L / 2.0L').trim(),
        oem: String(raw.oem || 'OEM-STD').trim(),
        type: String(raw.type || 'Tipo Lápiz Individual').trim(),
        connector: String(raw.connector || 'Conector 4 Pines').trim(),
        price: safePrice,
        oldPrice: safeOldPrice,
        stock: safeStock,
        inStock: safeStock > 0,
        warranty: String(raw.warranty || '12 meses').trim(),
        badge: String(raw.badge || 'OEM Spec').trim()
      };
    }

    function getEngineLabel(engine) {
      const map = { supabase: 'Supabase (PostgreSQL)', mongodb: 'MongoDB Atlas', mysql: 'MySQL / MariaDB', local: 'LocalStorage DB' };
      return map[engine] || 'Supabase (PostgreSQL)';
    }

    function normalizeWaPhone(rawPhone) {
      let digits = String(rawPhone || OFFICIAL_WA_RAW).replace(/[^0-9]/g, '');
      if (!digits) digits = '584126497478';
      if (digits.startsWith('0') && digits.length === 11) digits = '58' + digits.substring(1);
      else if (digits.length === 10 && (digits.startsWith('412') || digits.startsWith('414') || digits.startsWith('424') || digits.startsWith('416') || digits.startsWith('426'))) digits = '58' + digits;
      return digits;
    }

    function parseCSV(csvText) {
      const rows = [];
      let currentRow = [];
      let currentField = '';
      let insideQuotes = false;
      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const nextChar = csvText[i + 1];
        if (char === '"') {
          if (insideQuotes && nextChar === '"') { currentField += '"'; i++; }
          else insideQuotes = !insideQuotes;
        } else if (char === ',' && !insideQuotes) {
          currentRow.push(currentField.trim());
          currentField = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentField.trim());
          currentField = '';
          if (currentRow.some(col => col.length > 0)) rows.push(currentRow);
          currentRow = [];
        } else {
          currentField += char;
        }
      }
      if (currentField.length > 0 || currentRow.length > 0) {
        currentRow.push(currentField.trim());
        if (currentRow.some(col => col.length > 0)) rows.push(currentRow);
      }
      if (rows.length < 2) throw new Error('El archivo CSV debe contener al menos cabecera y 1 fila de datos.');
      const headers = rows[0].map(h => h.trim().replace(/^"|"$/g, ''));
      const records = [];
      for (let r = 1; r < rows.length; r++) {
        const row = rows[r];
        const obj = {};
        headers.forEach((h, idx) => { obj[h] = row[idx] !== undefined ? row[idx] : ''; });
        records.push(obj);
      }
      return records;
    }

    function exportToCSV(items) {
      const headers = ['id', 'name', 'brand', 'carModel', 'engine', 'oem', 'type', 'connector', 'price', 'oldPrice', 'stock', 'warranty', 'badge'];
      const escapeField = val => {
        const str = String(val ?? '');
        if (str.includes(',') || str.includes('"') || str.includes('\n')) return `"${str.replace(/"/g, '""')}"`;
        return str;
      };
      const headerRow = headers.join(',');
      const dataRows = items.map(item => headers.map(h => escapeField(item[h])).join(','));
      return [headerRow, ...dataRows].join('\n');
    }

    function exportToSQL(items) {
      const safe = str => String(str ?? '').replace(/'/g, "''");
      const inserts = items.map(b => 
        `INSERT INTO bobinas_inventario (id, name, brand, car_model, engine, oem, type, connector, price, old_price, stock, warranty, badge) VALUES ('${safe(b.id)}', '${safe(b.name)}', '${safe(b.brand)}', '${safe(b.carModel)}', '${safe(b.engine)}', '${safe(b.oem)}', '${safe(b.type)}', '${safe(b.connector)}', ${Number(b.price).toFixed(2)}, ${Number(b.oldPrice || b.price * 1.2).toFixed(2)}, ${b.stock}, '${safe(b.warranty)}', '${safe(b.badge)}');`
      ).join('\n');
      return `-- DUMP SQL BOBINAS EXPRESS\n${inserts}`;
    }

    function downloadFile(content, fileName, mimeType = 'text/plain;charset=utf-8;') {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // --- CONTEXTS ---
    const ToastContext = createContext(null);
    function ToastProvider({ children }) {
      const [toast, setToast] = useState({ message: '', visible: false });
      const showToast = useCallback((message) => {
        setToast({ message, visible: true });
        setTimeout(() => setToast(prev => ({ ...prev, visible: false })), 3200);
      }, []);
      return (
        <ToastContext.Provider value={{ showToast }}>
          {children}
          <div className={`fixed bottom-6 right-6 z-50 transform transition-all duration-300 pointer-events-none ${toast.visible ? 'translate-y-0 opacity-100' : 'translate-y-10 opacity-0'}`}>
            <div className="bg-slate-900 border border-brand-500/50 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-3 backdrop-blur-md max-w-md">
              <div className="h-8 w-8 rounded-xl bg-brand-500/20 text-brand-400 flex items-center justify-center shrink-0">
                <i className="fa-solid fa-bell text-sm"></i>
              </div>
              <span className="text-xs font-semibold">{toast.message}</span>
            </div>
          </div>
        </ToastContext.Provider>
      );
    }
    const useToast = () => useContext(ToastContext);

    const AuthContext = createContext(null);
    function AuthProvider({ children }) {
      const { showToast } = useToast();
      const [isAdmin, setIsAdmin] = useState(() => localStorage.getItem('AUTOIGNITION_ADMIN_SESSION_V2') === 'true');
      const [deviceId] = useState(() => {
        let s = localStorage.getItem('AUTOIGNITION_PRIVATE_CLIENT_ID_V2');
        if (!s) { s = 'CLI-' + Math.random().toString(36).substring(2, 8).toUpperCase(); localStorage.setItem('AUTOIGNITION_PRIVATE_CLIENT_ID_V2', s); }
        return s;
      });
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authLockReason, setAuthLockReason] = useState('');
      const [pendingAction, setPendingAction] = useState(null);

      const login = (user, pass) => {
        const u = String(user || '').trim().toLowerCase();
        const p = String(pass || '').trim();
        if ((u === 'admin' || u === 'dueno') && (p === 'admin123' || p === '4747')) {
          setIsAdmin(true);
          localStorage.setItem('AUTOIGNITION_ADMIN_SESSION_V2', 'true');
          showToast('🔓 Sesión de Administrador iniciada: Módulos críticos desbloqueados');
          setAuthModalOpen(false);
          if (typeof pendingAction === 'function') { const act = pendingAction; setPendingAction(null); act(); }
          return true;
        } else {
          showToast('❌ Credenciales incorrectas (Usa admin / admin123 o PIN 4747)');
          return false;
        }
      };

      const logout = () => {
        setIsAdmin(false);
        localStorage.removeItem('AUTOIGNITION_ADMIN_SESSION_V2');
        showToast('🔒 Sesión de Administrador cerrada');
      };

      const requireAdminAuth = (callback, reason = 'Acción requiere sesión de Administrador.') => {
        if (isAdmin) { callback(); return true; }
        setPendingAction(() => callback);
        setAuthLockReason(reason);
        setAuthModalOpen(true);
        return false;
      };

      return (
        <AuthContext.Provider value={{ isAdmin, deviceId, login, logout, requireAdminAuth, authModalOpen, authLockReason, openAuthModal: (r) => { setAuthLockReason(r || ''); setAuthModalOpen(true); }, closeAuthModal: () => setAuthModalOpen(false) }}>
          {children}
        </AuthContext.Provider>
      );
    }
    const useAuth = () => useContext(AuthContext);

    const InventoryContext = createContext(null);
    function InventoryProvider({ children }) {
      const { showToast } = useToast();
      const [coils, setCoils] = useState(() => {
        try {
          const s = localStorage.getItem('AUTOIGNITION_DB_INVENTORY_V2');
          if (s !== null) { const p = JSON.parse(s); if (Array.isArray(p)) return p.map(normalizeCoilRecord); }
        } catch (e) {}
        return DEFAULT_BOBINAS_SEED.map(normalizeCoilRecord);
      });
      const [dbEngine, setDbEngine] = useState(() => localStorage.getItem('AUTOIGNITION_DB_ENGINE_V2') || 'supabase');
      const [salesHistory, setSalesHistory] = useState(() => {
        try { const s = localStorage.getItem('AUTOIGNITION_SALES_LOG_V1'); if (s) return JSON.parse(s); } catch (e) {}
        return INITIAL_SALES_SEED;
      });
      const [ownerSettings, setOwnerSettings] = useState(() => {
        try { const s = localStorage.getItem('AUTOIGNITION_OWNER_PREFS_V2'); if (s) return JSON.parse(s); } catch (e) {}
        return {
          ownerPhone: OFFICIAL_WA_RAW,
          ownerName: 'Administrador Principal',
          autoDeductStock: true,
          soundAlert: true,
          requireApproval: false,
          systemPrompt: `Eres el Asesor Oficial de "Bobinas Express" para WhatsApp (0412-6497478). Consulta la base de datos en tiempo real, verifica el stock y cierra ventas.`
        };
      });
      const [pendingOwnerAlert, setPendingOwnerAlert] = useState(null);

      useEffect(() => { localStorage.setItem('AUTOIGNITION_DB_INVENTORY_V2', JSON.stringify(coils)); }, [coils]);
      useEffect(() => { localStorage.setItem('AUTOIGNITION_SALES_LOG_V1', JSON.stringify(salesHistory)); }, [salesHistory]);
      useEffect(() => { localStorage.setItem('AUTOIGNITION_DB_ENGINE_V2', dbEngine); }, [dbEngine]);
      useEffect(() => { localStorage.setItem('AUTOIGNITION_OWNER_PREFS_V2', JSON.stringify(ownerSettings)); }, [ownerSettings]);

      const changeDbEngine = (eng) => { setDbEngine(eng); showToast(`Motor cambiado a: ${eng.toUpperCase()}`); };
      const updateOwnerSettings = (newSettings) => { setOwnerSettings(prev => ({ ...prev, ...newSettings })); showToast('Configuración guardada'); };
      const upsertCoil = (raw) => {
        const item = normalizeCoilRecord(raw);
        setCoils(prev => {
          const idx = prev.findIndex(b => b.id.toLowerCase() === item.id.toLowerCase());
          if (idx >= 0) { const next = [...prev]; next[idx] = item; return next; }
          return [item, ...prev];
        });
        showToast(`Bobina ${item.id} guardada`);
      };
      const deleteCoil = (id) => { setCoils(prev => prev.filter(b => b.id !== id)); showToast(`Bobina ${id} eliminada`); };
      const clearInventory = () => { setCoils([]); showToast('Base de datos vaciada por completo (0 artículos)'); };
      const restoreSeedData = () => { const fresh = DEFAULT_BOBINAS_SEED.map(normalizeCoilRecord); setCoils(fresh); showToast('Inventario restaurado'); };
      const bulkImport = (records, replaceAll) => {
        const norm = records.map(normalizeCoilRecord);
        setCoils(prev => {
          if (replaceAll) return norm;
          const map = new Map();
          prev.forEach(i => map.set(i.id.toLowerCase(), i));
          norm.forEach(i => map.set(i.id.toLowerCase(), i));
          return Array.from(map.values());
        });
        showToast(`Carga masiva: ${norm.length} productos procesados.`);
      };

      const processSaleTransaction = ({ coilId, qty, customerName, customerPhone, paymentRef, userId }) => {
        let orderResult = null;
        setCoils(currentCoils => {
          const coil = currentCoils.find(b => b.id === coilId);
          if (!coil) return currentCoils;
          const reqQty = Math.max(1, parseInt(qty, 10) || 1);
          if (coil.stock < reqQty) { showToast(`Stock insuficiente (${coil.stock} uds)`); return currentCoils; }
          const stockAfter = ownerSettings.autoDeductStock ? Math.max(0, coil.stock - reqQty) : coil.stock;

          const newOrder = {
            orderId: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            userId: userId || 'CLI-GUEST',
            customerName: customerName || 'Cliente WhatsApp Directo',
            customerPhone: customerPhone || 'WhatsApp',
            coilId: coil.id,
            coilName: coil.name,
            oem: coil.oem.split('/')[0].trim(),
            qty: reqQty,
            unitPrice: coil.price,
            totalPrice: Number((coil.price * reqQty).toFixed(2)),
            stockBefore: coil.stock,
            stockAfter,
            paymentRef: paymentRef || 'Confirmación directa',
            status: ownerSettings.requireApproval ? 'PENDING_APPROVAL' : 'CONFIRMED'
          };
          orderResult = newOrder;
          setSalesHistory(prev => [newOrder, ...prev]);
          setPendingOwnerAlert(newOrder);

          if (ownerSettings.soundAlert) {
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator(); const gain = ctx.createGain();
              osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime); osc.frequency.setValueAtTime(1318.5, ctx.currentTime + 0.09);
              gain.gain.setValueAtTime(0.12, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
              osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.35);
            } catch(e) {}
          }

          return currentCoils.map(item => item.id === coil.id ? { ...item, stock: stockAfter, inStock: stockAfter > 0 } : item);
        });
        return orderResult;
      };

      const revertSale = (orderId) => {
        const ord = salesHistory.find(s => s.orderId === orderId);
        if (!ord) return;
        setCoils(currentCoils => currentCoils.map(item => item.id === ord.coilId ? { ...item, stock: item.stock + ord.qty, inStock: true } : item));
        setSalesHistory(prev => prev.map(s => s.orderId === orderId ? { ...s, status: 'REVERTED' } : s));
        showToast(`Venta #${orderId} revertida (+${ord.qty} unidades al stock)`);
      };

      return (
        <InventoryContext.Provider value={{ coils, dbEngine, changeDbEngine, upsertCoil, deleteCoil, clearInventory, restoreSeedData, bulkImport, salesHistory, ownerSettings, updateOwnerSettings, processSaleTransaction, revertSale, pendingOwnerAlert, dismissOwnerAlert: () => setPendingOwnerAlert(null) }}>
          {children}
        </InventoryContext.Provider>
      );
    }

    function CartProvider({ children }) {
      const { deviceId } = useAuth();
      const { coils, processSaleTransaction, ownerSettings } = useInventory();
      const { showToast } = useToast();
      const [cart, setCart] = useState(() => {
        try {
          const s = localStorage.getItem('AUTOIGNITION_PRIVATE_CARTS_V2');
          if (s) { const p = JSON.parse(s); if (p[deviceId]) return p[deviceId]; }
        } catch(e) {}
        return [];
      });
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [buyerDraft, setBuyerDraft] = useState(() => {
        try { const s = localStorage.getItem('AUTOIGNITION_BUYER_DRAFT_V2'); if (s) return JSON.parse(s); } catch(e) {}
        return { name: '', phone: '', car: '', payRef: '' };
      });

      const persistCart = (newCart) => {
        try {
          const s = localStorage.getItem('AUTOIGNITION_PRIVATE_CARTS_V2');
          const all = s ? JSON.parse(s) : {};
          all[deviceId] = newCart;
          localStorage.setItem('AUTOIGNITION_PRIVATE_CARTS_V2', JSON.stringify(all));
        } catch(e) {}
      };

      const updateBuyerDraft = (fields) => {
        setBuyerDraft(prev => {
          const next = { ...prev, ...fields };
          localStorage.setItem('AUTOIGNITION_BUYER_DRAFT_V2', JSON.stringify(next));
          return next;
        });
      };

      const addToCart = (productId, requestedQty = 1) => {
        const product = coils.find(b => b.id === productId);
        if (!product || product.stock <= 0) { showToast('Sin stock disponible'); return; }
        setCart(prev => {
          const existing = prev.find(i => i.id === productId);
          let next;
          if (existing) {
            if (existing.qty + requestedQty <= product.stock) {
              next = prev.map(i => i.id === productId ? { ...i, qty: i.qty + requestedQty } : i);
              showToast(`Carrito: ${existing.qty + requestedQty}x ${product.name}`);
            } else {
              showToast(`Límite de stock alcanzado (${product.stock} uds)`);
              return prev;
            }
          } else {
            next = [...prev, { id: product.id, name: product.name, price: product.price, oem: product.oem.split('/')[0].trim(), qty: 1, maxStock: product.stock }];
            showToast(`Añadido: ${product.name}`);
          }
          persistCart(next);
          return next;
        });
      };

      const updateCartQty = (productId, delta) => {
        setCart(prev => {
          const product = coils.find(b => b.id === productId);
          const max = product ? product.stock : 99;
          const next = prev.map(item => {
            if (item.id === productId) {
              const n = item.qty + delta;
              return { ...item, qty: Math.min(max, n) };
            }
            return item;
          }).filter(item => item.qty > 0);
          persistCart(next);
          return next;
        });
      };

      const removeFromCart = (id) => {
        setCart(prev => {
          const next = prev.filter(i => i.id !== id);
          persistCart(next);
          return next;
        });
        showToast('Producto eliminado');
      };

      const checkoutViaWhatsApp = () => {
        if (cart.length === 0) { showToast('El carrito está vacío'); return; }
        if (!buyerDraft.name.trim() || !buyerDraft.phone.trim()) { showToast('Ingresa Nombre y WhatsApp para ordenar'); return; }

        const orderIds = [];
        cart.forEach(item => {
          const res = processSaleTransaction({
            coilId: item.id,
            qty: item.qty,
            customerName: buyerDraft.name.trim(),
            customerPhone: buyerDraft.phone.trim(),
            paymentRef: buyerDraft.payRef.trim() || 'Coordinar por WA',
            userId: deviceId
          });
          if (res) orderIds.push(res.orderId);
        });

        const itemsText = cart.map(i => `• ${i.qty}x ${i.name} ($${Number(i.price).toFixed(2)})`).join('\n');
        const totalVal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);
        const orderTag = orderIds.join(', ') || 'ORD-WA';

        const msg = `⚡ *NUEVO PEDIDO CONFIRMADO (${orderTag}) - BOBINAS EXPRESS*\n\n` +
          `👤 *Cliente:* ${buyerDraft.name} (${buyerDraft.phone})\n` +
          `🚗 *Vehículo:* ${buyerDraft.car || 'Por especificar'}\n` +
          `💳 *Pago:* ${buyerDraft.payRef || 'A coordinar'}\n\n` +
          `📦 *Repuestos:*\n${itemsText}\n\n` +
          `💰 *Total:* $${totalVal.toFixed(2)} USD\n\n` +
          `✅ *Stock reservado en sistema.*`;

        const phone = normalizeWaPhone(ownerSettings.ownerPhone);
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
        setCart([]);
        persistCart([]);
        setIsCartOpen(false);
      };

      const cartCount = cart.reduce((acc, curr) => acc + curr.qty, 0);
      const cartSubtotal = cart.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

      return (
        <CartContext.Provider value={{ cart, cartCount, cartSubtotal, isCartOpen, setIsCartOpen, toggleCart: () => setIsCartOpen(p => !p), closeCart: () => setIsCartOpen(false), addToCart, updateCartQty, removeFromCart, buyerDraft, updateBuyerDraft, checkoutViaWhatsApp }}>
          {children}
        </CartContext.Provider>
      );
    }

        if (!text) return;
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        setMessages(prev => [...prev, { id: Math.random().toString(), sender: 'user', text, time }]);
        setInput('');
        setIsTyping(true);

        setTimeout(() => {
          setIsTyping(false);
          const clean = text.toLowerCase();
          const tokens = clean.replace(/[¿?¡!.,;:#()]/g, ' ').split(/\s+/).filter(w => w.length >= 2 && !['hola', 'tienen', 'precio', 'bobina', 'para', 'de', 'el', 'la'].includes(w));

          let bestMatch = null;
          let maxScore = 0;
          coils.forEach(item => {
            const h = `${item.id} ${item.name} ${item.brand} ${item.carModel} ${item.engine} ${item.oem}`.toLowerCase();
            let score = 0;
            tokens.forEach(tk => { if (h.includes(tk)) score += 3; });
            if (score > maxScore) { maxScore = score; bestMatch = item; }
          });

          const isBuy = clean.includes('comprar') || clean.includes('pago') || clean.includes('ref') || clean.includes('confirmo');
          let botHtml = '';
          let product = null;

          if (isBuy && bestMatch && bestMatch.stock > 0) {
            const ord = processSaleTransaction({ coilId: bestMatch.id, qty: 1, customerName: 'Cliente Chat WA', customerPhone: 'WhatsApp', paymentRef: text, userId: deviceId });
            botHtml = `🎉 <strong>¡VENTA CONFIRMADA! (#${ord.orderId})</strong><br><br>Descontamos 1x <strong>${bestMatch.name}</strong> del inventario:<br>• <strong>Total:</strong> <span class="text-emerald-400 font-bold">${formatUSD(bestMatch.price)} USD</span><br>• <strong>Nuevo Stock DB:</strong> ${ord.stockBefore} ➔ <strong>${ord.stockAfter} uds</strong><br><br>📲 <em>Alerta enviada al dueño al ${ownerSettings.ownerPhone}.</em>`;
            setLogs(prev => [{ id: Math.random().toString(), time, query: `TX COMMIT: #${ord.orderId} [${bestMatch.id}]`, count: 1, engine: getEngineLabel(dbEngine), latency: 25 }, ...prev]);
          } else if (bestMatch && maxScore > 0) {
            product = bestMatch;
            if (bestMatch.stock > 0) {
              botHtml = `✅ ¡Sí, disponible en stock inmediato!<br><br>• <strong>${bestMatch.name}</strong><br>• <strong>Aplicación:</strong> ${bestMatch.carModel}<br>• <strong>Precio:</strong> <span class="text-brand-400 font-bold">${formatUSD(bestMatch.price)} USD</span><br>• <strong>Stock:</strong> <span class="text-emerald-400 font-bold">${bestMatch.stock} unidades</span><br>• <strong>OEM:</strong> <code>${bestMatch.oem}</code><br><br>Escribe <code>"Quiero comprar ref 12345"</code> o usa el botón abajo para cerrar tu compra.`;
            } else {
              botHtml = `⚠️ La <strong>${bestMatch.name}</strong> se encuentra temporalmente con <strong>Stock: 0 unidades</strong>.<br>Precio: ${formatUSD(bestMatch.price)} USD. ¿Deseas encargarla bajo pedido?`;
            }
            setLogs(prev => [{ id: Math.random().toString(), time, query: `SELECT * WHERE id='${bestMatch.id}'`, count: 1, engine: getEngineLabel(dbEngine), latency: 32 }, ...prev]);
          } else {
            botHtml = `Consulté la base de datos para <em>"${text}"</em> y no encontré un registro exacto. Escríbeme la marca, modelo de auto o código OEM para verificar.`;
            setLogs(prev => [{ id: Math.random().toString(), time, query: `SELECT * WHERE name LIKE '%${tokens.join(' ')}%'`, count: 0, engine: getEngineLabel(dbEngine), latency: 18 }, ...prev]);
          }

          setMessages(prev => [...prev, { id: Math.random().toString(), sender: 'bot', html: botHtml, product, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) }]);
        }, 500);
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

            <div className="bg-[#075e54] text-white p-3.5 flex items-center justify-between shadow">

                <div>

            <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-[#0b141a]">
              {messages.map(m => (

                      <div className="font-semibold text-brand-400 text-[10px] uppercase mb-1"><i className="fa-solid fa-microchip"></i> Asesor Bobinas Express AI</div>

              {isTyping && <div className="text-xs text-gray-400 italic">Consultando base de datos...</div>}
              <div ref={endRef} />

            <div className="p-3 bg-slate-900 border-t border-slate-800 flex items-center gap-2">

              href="https://wa.me/584126497478"
              target="_blank"
              rel="noopener noreferrer"
              className="text-emerald-400 hover:text-emerald-300 font-semibold underline"
            >
              WhatsApp
            </a>{' '}
            • Desarrollado con React 18 Modular
          </footer>

          <CartDrawer />
          <AuthModal />

          {/* Modal Edición / Creación Rápida */}
          {(createModal || editCoil) && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-3">
                <h3 className="text-sm font-bold text-white">{editCoil ? `Editar ${editCoil.id}` : 'Nueva Bobina'}</h3>
                <input id="editName" defaultValue={editCoil?.name || ''} placeholder="Nombre de la bobina" className="w-full p-2 bg-slate-800 border border-slate-700 rounded text-xs text-white" />
                <input id="editBrand" defaultValue={editCoil?.brand || 'Chevrolet'} placeholder="Marca" className="w-full p-2 bg-slate-800 border border-slate-700 rounded text-xs text-white" />
                <input id="editModel" defaultValue={editCoil?.carModel || ''} placeholder="Modelos compatibles" className="w-full p-2 bg-slate-800 border border-slate-700 rounded text-xs text-white" />
                <input id="editOem" defaultValue={editCoil?.oem || ''} placeholder="Código OEM" className="w-full p-2 bg-slate-800 border border-slate-700 rounded text-xs text-white" />
                <div className="grid grid-cols-2 gap-2">
                  <input id="editPrice" type="number" step="0.01" defaultValue={editCoil?.price || 25} placeholder="Precio USD" className="w-full p-2 bg-slate-800 border border-slate-700 rounded text-xs text-white" />
                  <input id="editStock" type="number" defaultValue={editCoil?.stock || 10} placeholder="Stock" className="w-full p-2 bg-slate-800 border border-slate-700 rounded text-xs text-white" />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => { setEditCoil(null); setCreateModal(false); }} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs">Cancelar</button>
                  <button onClick={() => {
                    upsertCoil({
                      id: editCoil?.id || `BOB-${Math.floor(100 + Math.random()*900)}`,
                      name: document.getElementById('editName').value,
                      brand: document.getElementById('editBrand').value,
                      carModel: document.getElementById('editModel').value,
                      oem: document.getElementById('editOem').value,
                      price: parseFloat(document.getElementById('editPrice').value) || 25,
                      stock: parseInt(document.getElementById('editStock').value, 10) || 0
                    });
                    setEditCoil(null); setCreateModal(false);
                  }} className="px-4 py-1.5 bg-brand-500 text-white font-bold rounded text-xs">Guardar</button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Carga Masiva */}
          {bulkModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-xs">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-lg w-full space-y-3">
                <h3 className="text-sm font-bold text-white">Carga Masiva (CSV / JSON)</h3>
                <textarea rows={8} value={bulkText} onChange={e => setBulkText(e.target.value)} placeholder="Pega aquí tu CSV o JSON..." className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded text-xs text-white font-mono" />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setBulkModal(false)} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs">Cancelar</button>
                  <button onClick={() => {
                    try {
                      let recs = [];
                      if (bulkText.trim().startsWith('[') || bulkText.trim().startsWith('{')) recs = JSON.parse(bulkText);
                      else recs = parseCSV(bulkText);
                      bulkImport(recs, false);
                      setBulkModal(false);
                    } catch(e) { alert('Error: ' + e.message); }
                  }} className="px-4 py-1.5 bg-sky-600 text-white font-bold rounded text-xs">Importar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ToastProvider>
        <AuthProvider>
          <InventoryProvider>
            <CartProvider>
              <App />
            </CartProvider>
          </InventoryProvider>
        </AuthProvider>
      </ToastProvider>
    );
  </script>
</body>
</html>
